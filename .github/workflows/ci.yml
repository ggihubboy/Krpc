name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            build_type: Debug
            asan: "OFF"
          - name: Release
            build_type: Release
            asan: "OFF"
          - name: ASan
            build_type: Debug
            asan: "ON"

    env:
      MUDUO_PREFIX: ${{ github.workspace }}/.deps/muduo
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sudo apt-get update && \
            sudo apt-get install --yes --no-install-recommends \
              build-essential cmake git \
              libboost-dev libboost-test-dev \
              libgoogle-glog-dev \
              libprotobuf-dev protobuf-compiler \
              libzookeeper-mt-dev && exit 0
            echo "apt install failed (attempt ${attempt}), retrying..."
            sleep 15
          done
          exit 1

      - name: Cache Muduo
        id: cache-muduo
        uses: actions/cache@v4
        with:
          path: ${{ env.MUDUO_PREFIX }}
          key: muduo-v2.0.2-ubuntu-24.04

      - name: Build Muduo
        if: steps.cache-muduo.outputs.cache-hit != 'true'
        run: ./scripts/install_muduo.sh "${MUDUO_PREFIX}"

      - name: Show protobuf toolchain
        run: |
          set -euo pipefail
          command -v protoc
          protoc --version

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_PREFIX_PATH="${MUDUO_PREFIX}" \
            -DKRPC_ENABLE_ASAN=${{ matrix.asan }}

      - name: Build
        run: |
          if ! cmake --build build --parallel 2; then
            cmake --build build --parallel 1 --verbose
            exit 1
          fi
          test -s build/src/Krpcheader.pb.cc
          test -s build/src/Krpcheader.pb.h
          test -s build/example/user.pb.cc
          test -s build/example/user.pb.h

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  integration:
    name: Integration (ZooKeeper smoke)
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      MUDUO_PREFIX: ${{ github.workspace }}/.deps/muduo
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            sudo apt-get update && \
            sudo apt-get install --yes --no-install-recommends \
              build-essential cmake git \
              libboost-dev libboost-test-dev \
              libgoogle-glog-dev \
              libprotobuf-dev protobuf-compiler \
              libzookeeper-mt-dev && exit 0
            echo "apt install failed (attempt ${attempt}), retrying..."
            sleep 15
          done
          exit 1

      - name: Cache Muduo
        id: cache-muduo
        uses: actions/cache@v4
        with:
          path: ${{ env.MUDUO_PREFIX }}
          key: muduo-v2.0.2-ubuntu-24.04

      - name: Build Muduo
        if: steps.cache-muduo.outputs.cache-hit != 'true'
        run: ./scripts/install_muduo.sh "${MUDUO_PREFIX}"

      - name: Show protobuf toolchain
        run: |
          set -euo pipefail
          command -v protoc
          protoc --version

      - name: Configure and build (Release)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${MUDUO_PREFIX}"
          if ! cmake --build build --parallel 2; then
            cmake --build build --parallel 1 --verbose
            exit 1
          fi
          test -s build/src/Krpcheader.pb.cc
          test -s build/src/Krpcheader.pb.h
          test -s build/example/user.pb.cc
          test -s build/example/user.pb.h

      - name: Run integration smoke
        env:
          KRPC_RUN_INTEGRATION: "1"
        run: ctest --test-dir build -R krpc_integration --output-on-failure

      - name: Cleanup Docker Compose
        if: always()
        run: |
          if command -v docker >/dev/null 2>&1 && docker compose version >/dev/null 2>&1; then
            docker compose -f docker-compose.yml down --remove-orphans || true
          elif command -v docker-compose >/dev/null 2>&1; then
            docker-compose -f docker-compose.yml down --remove-orphans || true
          fi
